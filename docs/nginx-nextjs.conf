# Example nginx config when Next.js runs behind nginx (e.g. on port 3000).
# IMPORTANT: Next.js chunk URLs contain parentheses from route groups, e.g.:
#   /_next/static/chunks/app/(dashboard)/regx/consultants/page-xxx.js
# Some nginx setups or security rules return 400 for paths with ( ).
# Use a simple location / that passes the full URI to Next.js (no regex on path).

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
